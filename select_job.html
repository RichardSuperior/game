    <script src="game.js"></script>
    <script>
    // ========== 音效系统 ==========
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudioCtx() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playTone(freq, duration, type, volume, delay) {
        try {
            const ctx = ensureAudioCtx();
            const t = ctx.currentTime + (delay || 0);
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(volume || 0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + duration);
        } catch(e) {}
    }

    // 页面加载音效
    function playLoadSound() {
        playTone(523.25, 1.0, 'sine', 0.07, 0.1);
        playTone(659.25, 1.2, 'sine', 0.05, 0.2);
        playTone(783.99, 1.4, 'sine', 0.04, 0.35);
    }

    // 职业选择音效
    function playSelectSound() {
        playTone(880, 0.1, 'sine', 0.12, 0);
        playTone(1100, 0.15, 'sine', 0.08, 0.05);
    }

    // 确认开始音效 - 上行琶音
    function playConfirmSound() {
        playTone(523.25, 0.15, 'sine', 0.12, 0);
        playTone(659.25, 0.15, 'sine', 0.10, 0.08);
        playTone(783.99, 0.15, 'sine', 0.10, 0.16);
        playTone(1046.5, 0.3, 'sine', 0.12, 0.24);
    }

    // 返回音效
    function playBackSound() {
        playTone(660, 0.1, 'sine', 0.1, 0);
        playTone(440, 0.15, 'sine', 0.08, 0.06);
    }

    // hover音效
    function playHoverSound() {
        playTone(700, 0.06, 'sine', 0.04, 0);
    }

    // ========== 飘浮星光粒子 ==========
    function createFloatingStars() {
        const container = document.getElementById('floatingStars');
        if (!container) return;
        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.className = 'star-particle';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = (Math.random() * 2.5 + 0.8) + 'px';
            star.style.height = star.style.width;
            star.style.animationDuration = (Math.random() * 4 + 3) + 's';
            star.style.animationDelay = (Math.random() * 5) + 's';
            star.style.opacity = Math.random() * 0.6 + 0.2;
            if (Math.random() > 0.7) {
                star.style.background = 'rgba(240, 192, 64, 0.8)';
                star.style.boxShadow = '0 0 4px rgba(240, 192, 64, 0.6)';
            }
            container.appendChild(star);
        }
    }

    // ========== 职业选择交互 ==========
    function bindJobEvents() {
        document.querySelectorAll('.job-option').forEach(opt => {
            const radio = opt.querySelector('input[type="radio"]');
            opt.addEventListener('mouseenter', () => playHoverSound(), { passive: true });
            radio.addEventListener('change', () => {
                playSelectSound();
                // 选中动画脉冲
                opt.classList.add('pulse-once');
                setTimeout(() => opt.classList.remove('pulse-once'), 500);
            });
        });
    }

    // ========== 随机选择职业 ==========
    function randomSelectJob() {
        const jobs = document.querySelectorAll('input[name="job"]');
        if (jobs.length === 0) return;
        const randomIndex = Math.floor(Math.random() * jobs.length);
        const selected = jobs[randomIndex];
        selected.checked = true;
        playSelectSound();
        // 高亮拍动效果
        const label = selected.closest('.job-option');
        if (label) {
            label.classList.add('pulse-once');
            setTimeout(() => label.classList.remove('pulse-once'), 500);
            label.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    // ========== 确认开始 ==========
    function confirmStart() {
        playConfirmSound();
        // 按钮按下动画
        const btn = document.querySelector('.start-game-btn');
        btn.classList.add('btn-press');
        setTimeout(() => {
            const selectedJob = document.querySelector('input[name="job"]:checked').value;
            initPlayerData(selectedJob);
            window.location.href = 'game.html';
        }, 400);
    }

    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', () => {
        createFloatingStars();
        bindJobEvents();

        // 检测职业视频是否可播放
        const jobVideo = document.getElementById('jobVideo');
        const jobVideoCard = document.getElementById('jobVideoCard');
        if (jobVideo && jobVideoCard) {
            const canPlay = jobVideo.canPlayType && jobVideo.canPlayType('video/mp4') !== '';
            if (!canPlay) {} else {
                const testTimeout = setTimeout(() => { jobVideoCard.style.display = 'none'; }, 4000);
                const show = () => { clearTimeout(testTimeout); jobVideoCard.style.display = 'block'; };
                jobVideo.addEventListener('loadedmetadata', show, { once: true });
                jobVideo.addEventListener('canplay', show, { once: true });
                jobVideo.addEventListener('error', () => { clearTimeout(testTimeout); jobVideoCard.style.display = 'none'; }, { once: true });
                jobVideo.load();
            }
        }

        // 检测背景图是否加载成功
        const bgImg = new Image();
        bgImg.onerror = function() { document.body.classList.add('bg-fallback'); };
        bgImg.src = 'bg.jpg';
        // 职业卡片交错入场
        document.querySelectorAll('.job-option').forEach((opt, i) => {
            opt.style.opacity = '0';
            opt.style.transform = 'translateX(-20px)';
            opt.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            setTimeout(() => {
                opt.style.opacity = '1';
                opt.style.transform = 'translateX(0)';
            }, 500 + i * 60);
        });
        // 首次交互后播放加载音效
        const playOnce = () => {
            playLoadSound();
            document.removeEventListener('click', playOnce);
            document.removeEventListener('touchstart', playOnce);
        };
        document.addEventListener('click', playOnce, { once: true });
        document.addEventListener('touchstart', playOnce, { once: true });
    });
    </script>
